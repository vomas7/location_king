# Loki в однобинарном режиме: хранение на диске, без объектного хранилища.
# Для одного сервера этого достаточно, а кластерная схема потребовала бы S3.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  # Свои логи Loki пишет скупо: иначе он занимает место рассказом о том, как
  # он сохраняет чужие логи
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Логи живут месяц: этого хватает, чтобы разобраться в жалобе игрока, и
  # диск маленького сервера не кончается
  retention_period: 720h
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  allow_structured_metadata: true
  volume_enabled: true
  max_query_series: 5000

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules

analytics:
  reporting_enabled: false
