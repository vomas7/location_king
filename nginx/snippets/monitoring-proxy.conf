# Проксирование на Grafana. Включается в server-блок, который deploy.sh
# собирает под выбранный контур: имя домена и сертификаты у контуров разные.

# Панель мониторинга не должна попадать в поиск и в чужие фреймы
add_header X-Robots-Tag "noindex, nofollow" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Grafana отдаёт большие дашборды и принимает снимки экрана
client_max_body_size 10m;

access_log /dev/stdout json_access;

location / {
    proxy_pass http://grafana:3000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    # Живые панели и обновление дашбордов идут по веб-сокету
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_read_timeout 120s;
}
