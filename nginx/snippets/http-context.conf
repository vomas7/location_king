# То, что обязано лежать в контексте http: формат журнала, таблицы соответствий
# и зоны ограничений.
#
# Отдельным файлом, потому что остальная общая часть контуров подключается
# внутрь server и здесь бы не заработала.

# Версию сервера знать никому не нужно: по ней сканер сразу подбирает список
# известных дыр именно этой версии
server_tokens off;

# ── Зоны ограничений ──────────────────────────────────────────────────
#
# Считаем по $binary_remote_addr, а не по заголовку: за Cloudflare real_ip
# уже подставил настоящий адрес игрока, и подделать его нельзя. Мегабайта
# зоны хватает примерно на шестнадцать тысяч адресов одновременно.
#
# Ограничения nginx не заменяют счётчики приложения, а стоят перед ними:
# приложение считает игровые действия и тратит на это Redis и базу, а здесь
# отсекается то, что до приложения доходить вообще не должно.

# Игровые запросы. Считается по адресу, а за одним адресом бывает целый офис
# или общежитие: игрок, двинувший снимок, забирает два десятка тайлов разом,
# и пятеро таких за общим NAT не должны мешать друг другу. Шестьдесят в
# секунду оставляют запас им и всё равно режут бота на порядки — у него счёт
# идёт на тысячи. Игровые действия при этом считает ещё и приложение
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/s;

# Вход и регистрация. Живой человек делает это раз в несколько минут,
# перебор пароля — десятками в секунду
limit_req_zone $binary_remote_addr zone=auth:10m rate=1r/s;

# Одновременные соединения с одного адреса
limit_conn_zone $binary_remote_addr zone=per_ip:10m;

# Отказ по лимиту — это ответ «слишком часто», а не ошибка сервера
limit_req_status 429;
limit_conn_status 429;

# Записывать каждый отказ на уровне ошибки незачем: при налёте бота таких
# строк тысячи, и они топят собой настоящие ошибки
limit_req_log_level warn;

# Уровень нужен, чтобы неудачные ответы было видно на той же панели, что и
# ошибки бэкенда: сборщик логов берёт его из поля level
map $status $log_level {
    default  "INFO";
    ~^4      "WARN";
    ~^5      "ERROR";
}

# Строка журнала — объект JSON: Loki разбирает поля сам, без регулярных
# выражений на стороне сборщика. escape=json экранирует кавычки в адресе и
# в user-agent, иначе одна кривая ссылка ломала бы разбор всей строки.
log_format json_access escape=json
    '{'
    '"time":"$time_iso8601",'
    '"level":"$log_level",'
    '"logger":"nginx",'
    '"request_id":"$request_id",'
    '"remote_addr":"$remote_addr",'
    '"host":"$host",'
    '"method":"$request_method",'
    '"path":"$request_uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time",'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent"'
    '}';

# Веб-сокеты Grafana: заголовок Connection должен стать upgrade только тогда,
# когда клиент действительно просит переключить протокол. Отправлять upgrade
# всегда нельзя — обычные запросы от этого ломаются
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
