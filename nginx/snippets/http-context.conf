# То, что обязано лежать в контексте http: формат журнала и таблицы соответствий.
#
# Отдельным файлом, потому что остальная общая часть контуров подключается
# внутрь server и здесь бы не заработала.

# Уровень нужен, чтобы неудачные ответы было видно на той же панели, что и
# ошибки бэкенда: сборщик логов берёт его из поля level
map $status $log_level {
    default  "INFO";
    ~^4      "WARN";
    ~^5      "ERROR";
}

# Строка журнала — объект JSON: Loki разбирает поля сам, без регулярных
# выражений на стороне сборщика. escape=json экранирует кавычки в адресе и
# в user-agent, иначе одна кривая ссылка ломала бы разбор всей строки.
log_format json_access escape=json
    '{'
    '"time":"$time_iso8601",'
    '"level":"$log_level",'
    '"logger":"nginx",'
    '"request_id":"$request_id",'
    '"remote_addr":"$remote_addr",'
    '"host":"$host",'
    '"method":"$request_method",'
    '"path":"$request_uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time",'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent"'
    '}';

# Веб-сокеты Grafana: заголовок Connection должен стать upgrade только тогда,
# когда клиент действительно просит переключить протокол. Отправлять upgrade
# всегда нельзя — обычные запросы от этого ломаются
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
