# Общая часть HTTP- и HTTPS-контуров: статика, API и заголовки безопасности.
# Фронтенд и API живут на одном origin, поэтому CORS не нужен вовсе.

# ── Заголовки безопасности ────────────────────────────────────────────
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# Страница не тянет ничего со сторонних доменов: всё собирается в бандл,
# шрифты лежат рядом. Наружу ходят только тайлы карты догадки, и то как img.
#
# Домен указан целиком, без звёздочки: OpenLayers 10 берёт тайлы с
# tile.openstreetmap.org, а шаблон *.tile.openstreetmap.org требует хотя бы
# одну поддоменную часть и такой адрес не покрывает. Соответствие проверяется
# тестом tests/unit/csp.test.ts — он спрашивает адрес у самого OpenLayers.
add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'self'; worker-src 'self' blob:" always;

# Запросы игры — это JSON в несколько килобайт. Мегабайта хватает с запасом
# всему, кроме загрузки аватарки: там свой предел, ниже
client_max_body_size 1m;

# Медленный клиент не должен держать соединение бесконечно: на этом строится
# самая дешёвая атака на веб-сервер — открыть сотни соединений и слать по
# байту в минуту. Игре столько времени на запрос не нужно
client_body_timeout 15s;
client_header_timeout 15s;
send_timeout 30s;
keepalive_timeout 30s;

# Одному адресу — не больше сотни одновременных соединений. Игрок открывает
# десяток на тайлы снимка, и сотня оставляет запас даже на общий адрес офиса
limit_conn per_ip 100;

# Запись о каждом запросе уходит в stdout и оттуда в Loki
access_log /dev/stdout json_access;

# ── Отсев сканеров ────────────────────────────────────────────────────
# Боты перебирают чужие панели и забытые файлы: wp-admin, phpmyadmin, .env,
# дампы базы. Ни одного такого пути в игре нет, и отвечать на них нечего.
# 444 закрывает соединение без ответа — сканер не получает даже кода, по
# которому мог бы отличить «нет такого» от «есть, но закрыто»
location ~* /(wp-admin|wp-includes|wp-login|wordpress|xmlrpc\.php|phpmyadmin|pma|myadmin|adminer|\.git|\.env|\.aws|\.ssh|config\.json|backup|dump\.sql|owa|autodiscover|cgi-bin|boaform|solr|jenkins|actuator|telescope|eval-stdin)(/|$) {
    return 444;
}

# Расширения языков, на которых игра не написана: .php, .asp, .jsp. Их
# перебирают в надежде найти чужую забытую CMS
location ~* \.(php|phtml|asp|aspx|jsp|cgi|pl|sh|bak|old|swp|sql|tar|gz|zip|rar)$ {
    return 444;
}

# Игра ходит шестью методами. Всё остальное — от TRACE до PROPFIND — либо
# сканер, либо ошибка, и до приложения доходить не должно
if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
    return 405;
}

# ── API ───────────────────────────────────────────────────────────────
# Показатели процесса нужны только изнутри контура
location = /api/metrics {
    deny all;
    access_log off;
}

# Загрузка аватарки — единственное место, куда приезжает файл. Фотография с
# телефона весит несколько мегабайт, и общего мегабайта ей не хватает.
# Пять — потолок с запасом: сервер всё равно откажет всему тяжелее четырёх
location = /api/auth/me/avatar {
    client_max_body_size 5m;
    limit_req zone=api burst=10 nodelay;

    proxy_pass http://backend:8000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $client_ip_chain;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    proxy_read_timeout 60s;
}

# Вход, регистрация и всё, что проверяет пароль. У приложения свои счётчики,
# но они тратят Redis и обращение к базе на каждую попытку; здесь перебор
# отсекается раньше и дешевле
location ~ ^/api/auth/(login|register|refresh) {
    limit_req zone=auth burst=10 nodelay;

    proxy_pass http://backend:8000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $client_ip_chain;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
}

location /api/ {
    # Тайлы снимка идут пачкой: игрок двинул карту — и ушло два десятка
    # запросов разом. Поэтому burst большой, а nodelay пропускает всплеск
    # сразу, не растягивая его во времени
    limit_req zone=api burst=120 nodelay;

    proxy_pass http://backend:8000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Значение задаёт контур: за Cloudflare это проверенный адрес игрока,
    # в остальных случаях — цепочка, как её собрал предыдущий прокси
    proxy_set_header X-Forwarded-For $client_ip_chain;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Один идентификатор на запрос: его придумывает nginx, бэкенд принимает
    # готовый и пишет в свои записи. По нему запись в журнале nginx находится
    # рядом с записью бэкенда, а игроку он возвращается в заголовке ответа
    proxy_set_header X-Request-ID $request_id;

    # Тайлы снимков идут через бэкенд и на первом запросе бывают медленными
    proxy_read_timeout 60s;
}

# ── Фронтенд ──────────────────────────────────────────────────────────
# Лимит нужен и здесь: страница отдаётся дёшево, но перебор несуществующих
# путей — это ровно то, чем занят сканер, и каждая его попытка доходит сюда
location / {
    limit_req zone=api burst=60 nodelay;

    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
}

# Конфигурация клиента может меняться при деплое — не кэшируем
location = /config.js {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store" always;
}

# Отметка версии: по ней проверяют, что на сервере свежая сборка. Закэшировать
# её — значит навсегда получать ответ «всё хорошо»
location = /version.json {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store" always;
}

# Тема ставится до того, как загрузилось приложение, поэтому лежит отдельным
# файлом без хеша в имени. Кэшируем ненадолго: устаревшая копия — это в худшем
# случае вспышка не той темы, но и держать её вечно незачем
location = /theme.js {
    root /usr/share/nginx/html;
    expires 1h;
    add_header Cache-Control "public";
}

# Сборка кладёт хеш в имя файла, поэтому эти файлы неизменяемы
location /assets/ {
    root /usr/share/nginx/html;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# Шрифты меняются только вместе с релизом, но хеша в имени у них нет:
# кэшируем надолго, а не навсегда
location /fonts/ {
    root /usr/share/nginx/html;
    expires 30d;
    add_header Cache-Control "public";
    access_log off;
}

location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}

access_log /var/log/nginx/locationking_access.log;
error_log /var/log/nginx/locationking_error.log;
