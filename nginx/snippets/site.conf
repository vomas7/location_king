# Общая часть HTTP- и HTTPS-контуров: статика, API и заголовки безопасности.
# Фронтенд и API живут на одном origin, поэтому CORS не нужен вовсе.

# ── Заголовки безопасности ────────────────────────────────────────────
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# Страница не тянет ничего со сторонних доменов: всё собирается в бандл,
# шрифты системные. Наружу ходят только тайлы карты догадки, и то как img.
add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self'; worker-src 'self' blob:" always;

client_max_body_size 1m;

# ── API ───────────────────────────────────────────────────────────────
location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Тайлы снимков идут через бэкенд и на первом запросе бывают медленными
    proxy_read_timeout 60s;
}

# ── Фронтенд ──────────────────────────────────────────────────────────
location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
}

# Конфигурация клиента может меняться при деплое — не кэшируем
location = /config.js {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store" always;
}

# Сборка кладёт хеш в имя файла, поэтому эти файлы неизменяемы
location /assets/ {
    root /usr/share/nginx/html;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}

access_log /var/log/nginx/locationking_access.log;
error_log /var/log/nginx/locationking_error.log;
