# Location King — HTTP-контур.
# Используется, когда TLS терминируется хостингом или балансировщиком.
# Вариант с сертификатами на своей стороне — в nginx/tls/site.conf.

# Формат журнала и таблицы соответствий: только контекст http
include /etc/nginx/snippets/http-context.conf;

server {
    # Слушаем только IPv4: наружу порты публикует Docker, и он же принимает
    # IPv6-соединения хоста. У самого контейнера IPv6 по умолчанию выключен, и
    # строка listen [::] уронила бы nginx на старте.
    listen 80;
    server_name _;

    # Перед нами стоит чужой балансировщик — он и терминирует TLS. Его
    # X-Forwarded-For мы читаем, но только от него самого: списку доверенных
    # сетей ниже принадлежат частные адреса, в которых балансировщики
    # хостингов и живут. Запрос, пришедший снаружи, своему заголовку не
    # верит — иначе любой подставил бы себе адрес и обошёл все лимиты,
    # считающиеся по адресу: регистрацию, вход, удаление учётной записи.
    #
    # Балансировщик стоит по внешнему адресу — добавьте его сеть сюда же,
    # иначе игроки будут считаться за одного.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # После real_ip здесь настоящий адрес игрока, и подделать его нельзя
    set $client_ip_chain $remote_addr;

    include /etc/nginx/snippets/site.conf;
}

# Узел мониторинга. Файл собирает deploy.sh под выбранный контур; по маске,
# а не по имени, — без мониторинга файла просто нет, и nginx это не смущает.
include /etc/nginx/snippets/monitoring-host*.conf;
