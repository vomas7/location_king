# Location King — HTTPS с сертификатом Let's Encrypt.
#
# Сертификат выпускает и продлевает certbot, лежит он в ./certbot/conf. Имя
# каталога задано ключом --cert-name main, поэтому путь здесь не зависит от
# домена и файл не нужно пересобирать под каждый сайт.

server {
    # Слушаем только IPv4: наружу порты публикует Docker, и он же принимает
    # IPv6-соединения хоста. У самого контейнера IPv6 по умолчанию выключен, и
    # строка listen [::] уронила бы nginx на старте.
    listen 80;
    server_name _;

    # Проверка Let's Encrypt приходит по HTTP и редиректу поддаваться не
    # должна — иначе продление молча перестанет проходить
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
    }

    # Весь остальной HTTP уезжает на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/main/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/main/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Игроки приходят прямо на сервер, без прокси посередине: адрес соединения
    # и есть адрес игрока, подставить чужой в заголовке нельзя
    set $client_ip_chain $remote_addr;

    include /etc/nginx/snippets/site.conf;
}
