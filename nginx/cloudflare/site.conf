# Location King — контур за Cloudflare.
#
# TLS терминируется дважды: браузер → Cloudflare по обычному сертификату,
# Cloudflare → этот сервер по origin-сертификату Cloudflare. В панели должен
# стоять режим Full (strict), иначе второй участок не проверяется вовсе.
#
# Файлы в ./ssl:
#   origin.pem, origin.key — origin-сертификат из панели Cloudflare
#   cloudflare-origin-pull-ca.pem — необязательно, для Authenticated Origin
#   Pulls: тогда сервер отвечает только самому Cloudflare
#
# Как это настроить — в docs/deployment.md.

# Формат журнала и таблицы соответствий: только контекст http
include /etc/nginx/snippets/http-context.conf;

server {
    # Слушаем только IPv4: наружу порты публикует Docker, и он же принимает
    # IPv6-соединения хоста. У самого контейнера IPv6 по умолчанию выключен, и
    # строка listen [::] уронила бы nginx на старте.
    listen 80;
    server_name _;

    # Сюда попадают только те, кто пришёл на сервер в обход Cloudflare
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/ssl/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Все три фрагмента создаёт deploy.sh и кладёт рядом: сети Cloudflare
    # меняются, а наличие клиентского сертификата зависит от того, включили ли
    # вы Authenticated Origin Pulls. В репозитории их нет намеренно —
    # захардкоженный список сетей однажды устарел бы молча.
    include /etc/nginx/snippets/cloudflare-real-ip.conf;
    include /etc/nginx/snippets/cloudflare-origin-pull.conf;

    # Подключаться разрешено только самому Cloudflare. Сканеры перебирают сети
    # хостингов и находят origin по адресу — а через него обходится и защита
    # Cloudflare, и подсчёт настоящего адреса игрока
    include /etc/nginx/snippets/cloudflare-only.conf;

    # После real_ip в $remote_addr уже настоящий адрес игрока, и подделать его
    # заголовком нельзя: то, что прислал клиент, мы не пересылаем.
    set $client_ip_chain $remote_addr;

    # HSTS выставляет и Cloudflare, но заголовок с origin переживёт переезд
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/snippets/site.conf;
}

# Узел мониторинга. Файл собирает deploy.sh под выбранный контур; по маске,
# а не по имени, — без мониторинга файла просто нет, и nginx это не смущает.
include /etc/nginx/snippets/monitoring-host*.conf;
