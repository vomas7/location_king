# Location King — HTTPS-контур.
# Ожидает сертификаты в ./ssl: fullchain.pem и privkey.pem.

# Формат журнала и таблицы соответствий: только контекст http
include /etc/nginx/snippets/http-context.conf;

server {
    # Слушаем только IPv4: наружу порты публикует Docker, и он же принимает
    # IPv6-соединения хоста. У самого контейнера IPv6 по умолчанию выключен, и
    # строка listen [::] уронила бы nginx на старте.
    listen 80;
    server_name _;

    # Весь HTTP уезжает на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Сертификат наш, значит игрок соединяется с этим сервером напрямую и
    # $remote_addr — его настоящий адрес. Продолжать цепочку X-Forwarded-For
    # здесь нельзя: её первый элемент пишет сам клиент, и приложение, читая
    # его, считало бы лимиты по адресу, который игрок сам себе и выбрал
    set $client_ip_chain $remote_addr;

    include /etc/nginx/snippets/site.conf;
}

# Узел мониторинга. Файл собирает deploy.sh под выбранный контур; по маске,
# а не по имени, — без мониторинга файла просто нет, и nginx это не смущает.
include /etc/nginx/snippets/monitoring-host*.conf;
