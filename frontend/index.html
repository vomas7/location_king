<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Location King — геогессер по спутниковым снимкам</title>
    <meta
      name="description"
      content="Геогессер по спутниковым снимкам: квадрат съёмки без подписей и координат, а вы ищете это место на карте мира. Челлендж дня, комнаты на компанию и таблица лидеров. Бесплатно, без рекламы."
    />
    <meta name="theme-color" content="#070d0c" />

    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- og:url, og:image и canonical добавляет сборка, если задан SITE_URL:
         неверный абсолютный адрес хуже отсутствующего -->
    <meta property="og:site_name" content="Location King" />
    <meta property="og:title" content="Location King — геогессер по спутниковым снимкам" />
    <meta
      property="og:description"
      content="Квадрат спутниковой съёмки без подписей и координат. Найди это место на карте мира — чем ближе, тем больше очков."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Location King: перекрестие на сетке тайлов" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Location King — геогессер по спутниковым снимкам" />
    <meta
      name="twitter:description"
      content="Квадрат спутниковой съёмки без подписей и координат. Найди это место на карте мира."
    />

    <!-- Перекрестие: тот же знак, что стоит в центре снимка. Инлайном, чтобы
         страница не ходила даже за иконкой -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23070d0c'/><g stroke='%23ffab2e' stroke-width='2' fill='none'><circle cx='16' cy='16' r='6'/><path d='M16 3v6M16 23v6M3 16h6M23 16h6'/></g></svg>"
    />

    <!-- Конфигурация окружения: подставляется при деплое, сборку не трогает -->
    <script src="/config.js"></script>

    <!-- Оформление до первой отрисовки: иначе светлая тема начиналась бы
         с тёмной вспышки, пока грузится приложение -->
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Приложение рисуется скриптом. Тем, у кого он выключен, полагается
         внятный текст, а не пустая страница -->
    <noscript>
      <h1>Location King — игра по спутниковым снимкам</h1>
      <p>
        Вам показывают квадрат спутниковой съёмки — без подписей и указателей, только земля сверху.
        Нужно найти это место на карте мира: чем ближе поставите точку, тем больше очков. Есть
        челлендж дня, комнаты для игры с друзьями и таблица лидеров. Играть бесплатно, рекламы и
        счётчиков на сайте нет.
      </p>
      <p>Чтобы играть, включите JavaScript.</p>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
