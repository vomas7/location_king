# Location King — прод-контур.
# Запуск: ./deploy.sh — он же создаст .env, накатит миграции и загрузит зоны.
#
# Dev-окружение поднимается отдельным файлом: make dev.

services:
  # ─────────────────────────────────────────
  # NGINX — статика фронтенда и прокси к API
  # ─────────────────────────────────────────
  nginx:
    build:
      context: ./frontend
      args:
        # Пусто — canonical, og:url и sitemap.xml в сборку не попадут
        SITE_URL: ${SITE_URL:-}
    container_name: location_king_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # NGINX_PROFILE=http — TLS терминирует хостинг; tls — сертификаты свои
      - ./nginx/${NGINX_PROFILE:-http}:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─────────────────────────────────────────
  # BACKEND — FastAPI
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: location_king_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?переменная обязательна, приложение без неё не стартует}
      SATELLITE_TILE_URL: ${SATELLITE_TILE_URL:-https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}}
      SATELLITE_ATTRIBUTION: ${SATELLITE_ATTRIBUTION:-Esri, Maxar, Earthstar Geographics}
      TILE_PREWARM: ${TILE_PREWARM:-true}
      DEBUG: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      # edge нужен не только для nginx: за тайлами снимков бэкенд ходит наружу
      - edge
      - data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ─────────────────────────────────────────
  # POSTGRESQL + POSTGIS
  # ─────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: location_king_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init_prod.sql:/docker-entrypoint-initdb.d/init_prod.sql:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # REDIS — кэш спутниковых тайлов
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: location_king_redis
    restart: unless-stopped
    command: >-
      redis-server --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  # Внешняя сеть: сюда смотрит nginx, отсюда же бэкенд ходит за снимками
  edge:
    driver: bridge
  # Внутренняя: база и кэш наружу не доступны
  data:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
