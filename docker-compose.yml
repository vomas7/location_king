# Location King — прод-контур.
# Запуск: ./deploy.sh — он же создаст .env, накатит миграции и загрузит зоны.
#
# Dev-окружение поднимается отдельным файлом: make dev.

services:
  # ─────────────────────────────────────────
  # NGINX — статика фронтенда и прокси к API
  # ─────────────────────────────────────────
  nginx:
    build:
      context: ./frontend
      args:
        # Пусто — canonical, og:url и sitemap.xml в сборку не попадут
        SITE_URL: ${SITE_URL:-}
        # Реквизиты оператора для условий использования и политики
        OPERATOR_NAME: ${OPERATOR_NAME:-}
        OPERATOR_EMAIL: ${OPERATOR_EMAIL:-}
    container_name: location_king_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Контур задаёт NGINX_PROFILE, значения — в .env.example
      - ./nginx/${NGINX_PROFILE:-http}:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./ssl:/etc/nginx/ssl:ro
      # Сертификат Let's Encrypt и каталог для проверки домена. Остальным
      # контурам они не мешают: конфигурация их просто не упоминает
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    # Продлённый сертификат появляется в томе рядом с работающим nginx, и
    # подхватывается он только перезагрузкой конфигурации. Раз в шесть часов —
    # с большим запасом: certbot продлевает за месяц до истечения
    command:
      - sh
      - -c
      - "while :; do sleep 6h; nginx -s reload; done & exec nginx -g 'daemon off;'"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─────────────────────────────────────────
  # CERTBOT — продление сертификата Let's Encrypt
  # ─────────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: location_king_certbot
    restart: unless-stopped
    # Поднимается только при NGINX_PROFILE=letsencrypt: его включает deploy.sh
    profiles:
      - letsencrypt
    # Наружу за продлением ходит по той же сети, что и остальной периметр
    networks:
      - edge
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Проверка раз в двенадцать часов — рекомендация Let's Encrypt: сертификат
    # продлевается за месяц до истечения, так что пара пропущенных попыток
    # ничего не ломает. trap нужен, чтобы docker compose down не ждал таймаута
    entrypoint: >-
      sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot --webroot-path /var/www/certbot;
        sleep 12h & wait $${!};
      done"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # ─────────────────────────────────────────
  # BACKEND — FastAPI
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: location_king_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?переменная обязательна, приложение без неё не стартует}
      SATELLITE_TILE_URL: ${SATELLITE_TILE_URL:-https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}}
      SATELLITE_ATTRIBUTION: ${SATELLITE_ATTRIBUTION:-Esri, Maxar, Earthstar Geographics}
      TILE_PREWARM: ${TILE_PREWARM:-true}
      DEBUG: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      # edge нужен не только для nginx: за тайлами снимков бэкенд ходит наружу
      - edge
      - data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ─────────────────────────────────────────
  # POSTGRESQL + POSTGIS
  # ─────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: location_king_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init_prod.sql:/docker-entrypoint-initdb.d/init_prod.sql:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # REDIS — кэш спутниковых тайлов
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: location_king_redis
    restart: unless-stopped
    command: >-
      redis-server --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  # Внешняя сеть: сюда смотрит nginx, отсюда же бэкенд ходит за снимками
  edge:
    driver: bridge
  # Внутренняя: база и кэш наружу не доступны
  data:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
