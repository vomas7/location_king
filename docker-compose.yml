# Location King — прод-контур.
# Запуск: ./deploy.sh — он же создаст .env, накатит миграции и загрузит зоны.
#
# Dev-окружение поднимается отдельным файлом: make dev.

services:
  # ─────────────────────────────────────────
  # NGINX — статика фронтенда и прокси к API
  # ─────────────────────────────────────────
  nginx:
    build:
      context: ./frontend
      args:
        # Пусто — canonical, og:url и sitemap.xml в сборку не попадут
        SITE_URL: ${SITE_URL:-}
        # Реквизиты оператора для условий использования и политики
        OPERATOR_NAME: ${OPERATOR_NAME:-}
        OPERATOR_EMAIL: ${OPERATOR_EMAIL:-}
    container_name: location_king_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Контур задаёт NGINX_PROFILE, значения — в .env.example
      - ./nginx/${NGINX_PROFILE:-http}:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./ssl:/etc/nginx/ssl:ro
      # Сертификат Let's Encrypt и каталог для проверки домена. Остальным
      # контурам они не мешают: конфигурация их просто не упоминает
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    # Продлённый сертификат появляется в томе рядом с работающим nginx, и
    # подхватывается он только перезагрузкой конфигурации. Раз в шесть часов —
    # с большим запасом: certbot продлевает за месяц до истечения
    command:
      - sh
      - -c
      - "while :; do sleep 6h; nginx -s reload; done & exec nginx -g 'daemon off;'"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edge
      # Чтобы проксировать на Grafana
      - observe
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─────────────────────────────────────────
  # CERTBOT — продление сертификата Let's Encrypt
  # ─────────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: location_king_certbot
    restart: unless-stopped
    # Поднимается только при NGINX_PROFILE=letsencrypt: его включает deploy.sh
    profiles:
      - letsencrypt
    # Наружу за продлением ходит по той же сети, что и остальной периметр
    networks:
      - edge
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Проверка раз в двенадцать часов — рекомендация Let's Encrypt: сертификат
    # продлевается за месяц до истечения, так что пара пропущенных попыток
    # ничего не ломает. trap нужен, чтобы docker compose down не ждал таймаута
    entrypoint: >-
      sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot --webroot-path /var/www/certbot;
        sleep 12h & wait $${!};
      done"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # ─────────────────────────────────────────
  # BACKEND — FastAPI
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: location_king_backend
    restart: unless-stopped
    # Четыре воркера по числу ядер. Больше не нужно: приложение асинхронное,
    # и лишние процессы только съедят память, которой на такой машине немного
    deploy:
      resources:
        limits:
          memory: 1500M
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?переменная обязательна, приложение без неё не стартует}
      SATELLITE_TILE_URL: ${SATELLITE_TILE_URL:-https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}}
      SATELLITE_ATTRIBUTION: ${SATELLITE_ATTRIBUTION:-Esri, Maxar, Earthstar Geographics}
      TILE_PREWARM: ${TILE_PREWARM:-true}
      # Строка лога объектом JSON: так её разбирает сборщик логов
      LOG_FORMAT: json
      DEBUG: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      # edge нужен не только для nginx: за тайлами снимков бэкенд ходит наружу
      - edge
      - data
      # Чтобы Prometheus мог снимать показатели
      - observe
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ─────────────────────────────────────────
  # POSTGRESQL + POSTGIS
  # ─────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: location_king_postgres
    restart: unless-stopped
    # Настройки под машину на четыре гигабайта. Значения по умолчанию у
    # PostgreSQL рассчитаны на то, чтобы запуститься где угодно, а не на то,
    # чтобы работать быстро: shared_buffers там 128 МБ независимо от машины.
    command: >-
      postgres
      -c max_connections=100
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c work_mem=8MB
      -c maintenance_work_mem=128MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c wal_compression=on
      -c max_wal_size=2GB
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init_prod.sql:/docker-entrypoint-initdb.d/init_prod.sql:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # REDIS — кэш спутниковых тайлов
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: location_king_redis
    restart: unless-stopped
    # volatile-lru вместо allkeys-lru: у тайлов есть срок жизни и вытеснять
    # можно их, а у счётчиков показателей срока нет — под общей политикой
    # Redis однажды выбросил бы именно их, и графики обнулились бы на ровном
    # месте. Сохранение на диск включено по той же причине.
    command: >-
      redis-server --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb --maxmemory-policy volatile-lru
      --save 300 100
    volumes:
      - redis_data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═════════════════════════════════════════
  # НАБЛЮДАЕМОСТЬ
  # Поднимается при MONITORING=true — профиль включает deploy.sh
  # ═════════════════════════════════════════

  # Показатели: снимает с бэкенда и с сервера, хранит месяц
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: location_king_prometheus
    restart: unless-stopped
    profiles:
      - monitoring
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.retention.size=4GB"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    networks:
      - observe
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Логи: хранение и поиск
  loki:
    image: grafana/loki:3.3.2
    container_name: location_king_loki
    restart: unless-stopped
    profiles:
      - monitoring
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./monitoring/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    networks:
      - observe
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  # Сбор логов всех контейнеров. Пришёл на смену Promtail, который Grafana
  # объявила устаревшим
  alloy:
    image: grafana/alloy:v1.6.1
    container_name: location_king_alloy
    restart: unless-stopped
    profiles:
      - monitoring
    # Контейнеры Alloy находит через докер, а сокет доступен только root.
    # Права намеренно ограничены чтением: писать в докер сборщику логов незачем
    user: root
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Журнал systemd: в нём работа автоматического развёртывания
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - alloy_data:/var/lib/alloy/data
    networks:
      - observe
    depends_on:
      - loki

  # Показатели самой машины: процессор, память, диск, сеть
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: location_king_node_exporter
    restart: unless-stopped
    profiles:
      - monitoring
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - observe

  # Панели и запросы к логам
  grafana:
    image: grafana/grafana:11.5.1
    container_name: location_king_grafana
    restart: unless-stopped
    profiles:
      - monitoring
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?пароль администратора Grafana обязателен}
      # Адрес собирает deploy.sh: он знает и домен, и контур, а Grafana
      # строит по нему ссылки в письмах и переходы после входа
      GF_SERVER_ROOT_URL: ${MONITORING_URL:-http://localhost:3000}
      GF_SERVER_DOMAIN: ${MONITORING_DOMAIN:-localhost}
      # Заводить учётные записи может только администратор: панель видна
      # из интернета, и открытая регистрация означала бы открытый доступ
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Наружу Grafana не ходит: сеть observe закрыта, а телеметрия и проверка
      # обновлений всё равно только мешали бы
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - observe
    depends_on:
      - prometheus
      - loki

networks:
  # Внешняя сеть: сюда смотрит nginx, отсюда же бэкенд ходит за снимками
  edge:
    driver: bridge
  # Внутренняя: база и кэш наружу не доступны
  data:
    driver: bridge
    internal: true
  # Наблюдаемость: тоже закрыта наружу. Grafana доступна только через nginx,
  # а Prometheus и Loki — только из этой сети
  observe:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  loki_data:
  alloy_data:
  grafana_data:
